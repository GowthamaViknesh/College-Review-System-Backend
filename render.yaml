# Render blueprint: in the Render dashboard choose New > Blueprint and pick this repository.
# MongoDB is not hosted by Render; use a MongoDB Atlas connection string for MONGODB_URI.

services:
  - type: web
    name: college-review-api
    runtime: node
    plan: free
    # TypeScript and its type packages are dev dependencies, and Render leaves those out
    # when NODE_ENV is production, so the build asks for them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      # The test library downloads a 100 MB MongoDB binary when installed. The server never uses it,
      # so skip it to keep deploys fast.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: 1
      # Asked for when the blueprint is first applied; never stored in the repository
      - key: MONGODB_URI
        sync: false
      # The deployed frontend's address, e.g. https://college-reviews.onrender.com
      # Several addresses can be listed, separated by commas.
      - key: CORS_ORIGIN
        sync: false
      # A random value created by Render, long enough for the production check at startup
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # Render's load balancer sits in front of the service. Without this every visitor would
      # appear to share one address, and the login rate limit would apply to all of them together.
      - key: TRUST_PROXY
        value: 1
      - key: ACTION_LOG_RETENTION_DAYS
        value: 90
