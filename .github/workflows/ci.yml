name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      # The tests start their own in-memory MongoDB, so no database service is needed here
      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
